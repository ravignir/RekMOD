All hail noble King Casimir the Great, protector and sovereign of the Kingdom of Poland. You ascended to the throne during a time of great turmoil, with the nation's economy in shambles and its people demoralized by the wars of your predecessor. And yet, your reign marked the beginning of a new era, with affluence and security afforded only by way of your careful governance. Among your most notable achievements, the code of laws you established gave legal authority to many of the accepted customs of the time, strengthening the nation. = Salve el noble rey Casimiro el Grande, protector y soberano del Reino de Polonia. Ascendiste al trono en una época de gran agitación, con la economía de la nación en ruinas y su pueblo desmoralizado por las guerras de tu predecesor. Sin embargo, tu reinado marcó el comienzo de una nueva era, en la que la prosperidad y la seguridad sólo pudieron alcanzarse gracias a tu cuidadoso gobierno. Entre tus logros más notables, el código de leyes que estableciste dio autoridad legal a muchas de las costumbres aceptadas de la época, fortaleciendo la nación.
