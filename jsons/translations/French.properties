Iklwa = 
Your people kneel before you, great warrior Shaka of the Zulu Kingdom. As you rose from a place of exile to become the true leader of the Zulus, you ushered in changes throughout the Zulu society, implementing new laws and cultural reforms that strengthened the position of your kingdom. However, it was your tenacity in the art of war that truly established your reputation, as your tactics and strategies on the battlefield forever changed the face of combat across the plains of southern Africa. = Ton peuple s'agenouille devant toi, grand guerrier Shaka du royaume zoulou. En sortant de l'exil pour devenir le véritable chef des Zoulous, tu as instauré des changements au sein de la société zouloue, instaurant de nouvelles lois et des réformes culturelles qui ont renforcé la position de ton royaume. Cependant, c'est ta ténacité dans l'art de la guerre qui a véritablement établi ta réputation, tes tactiques et stratégies sur le champ de bataille ayant changé à jamais le visage du combat dans les plaines d'Afrique australe.
Most formidable king, your people once again long for the unity and strength your leadership afforded them. Can you return the Zulu kingdom to such great prominence? Will you build a civilization that stands the test of time? = Roi redoutable, votre peuple aspire à nouveau à l'unité et à la force que votre règne lui a conférées. Parviendrez-vous à redonner au royaume zoulou son prestige? Saurez-vous bâtir une civilisation à l'épreuve du temps?
