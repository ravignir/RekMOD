The Blessings of Heaven be upon you. Empress Wu Zetian, most beautiful and haughty ruler of China! Oh great Empress, whose shadow causes the flowers to blossom and the rivers to flow! You are the leader of the Chinese, the oldest and the greatest civilization that humanity has ever produced. China's history stretches back into the mists of time, its people achieving many great things long before the other upstart civilizations were even conceived. China's contributions to the arts and sciences are too many and too wondrous to do justice to - the printing press, gunpowder, the works of Confucius - these are but a few of the gifts China has given to an undeserving world! = Que le Ciel vous bénisse. Impératrice Wu Zetian, souveraine la plus belle et la plus fière de Chine! Ô grande impératrice, dont l'ombre fait éclore les fleurs et couler les rivières! Vous êtes la dirigeante des Chinois, la plus ancienne et la plus grande civilisation que l'humanité ait jamais engendrée. L'histoire de la Chine remonte à la nuit des temps, son peuple ayant accompli de grandes choses bien avant même la naissance des autres civilisations naissantes. Les contributions de la Chine aux arts et aux sciences sont trop nombreuses et trop merveilleuses pour être mises à sa juste valeur : l'imprimerie, la poudre à canon, les œuvres de Confucius… ce ne sont là que quelques-uns des dons que la Chine a offerts à un monde qui ne le mérite pas!
You, great Queen, who, with cunning and beauty, rose from the position of lowly concubine to that of Divine Empress - your people call out to you to lead them! Great China is once again beset on all sides by barbarians. Can you defeat all your many foes and return your country to greatness? Can you build a civilization to stand the test of time? = Toi, grande Reine, qui, par ta ruse et ta beauté, as passé du statut de concubine à celui d'Impératrice divine, ton peuple t'appelle à sa tête! La Chine est à nouveau assiégée de toutes parts par des barbares. Saurez-vous vaincre tous vos nombreux ennemis et rendre à votre pays sa grandeur? Saurez-vous bâtir une civilisation qui résistera à l'épreuve du temps?
