Your men stand proudly to greet you, Great Attila, grand warrior and ruler of the Hunnic empire. Together with your brother Bleda you expanded the boundaries of your empire, becoming the most powerful and frightening force of the 5th century. You bowed the Eastern Roman Emperors to your will and took kingdom after kingdom along the Danube and Nisava Rivers. As the sovereign ruler of the Huns, you marched your army across Europe into Gaul, planning to extend your already impressive lands all the way to the Atlantic Ocean. Your untimely death led to the quick disintegration and downfall of your empire, but your name and deeds have created an everlasting legacy for your people. = Tes hommes se tiennent fièrement à ton honneur, Grand Attila, grand guerrier et souverain de l'empire hunnique. Aux côtés de ton frère Bleda, tu as étendu les frontières de ton empire, devenant la force la plus puissante et la plus redoutable du Ve siècle. Tu as soumis les empereurs romains d'Orient à ta volonté et conquis royaume après royaume le long du Danube et de la Nisava. Souverain des Huns, tu as fait traverser l'Europe à ton armée jusqu'en Gaule, prévoyant d'étendre tes terres déjà impressionnantes jusqu'à l'océan Atlantique. Ta mort prématurée a entraîné la désintégration et la chute rapides de ton empire, mais ton nom et tes actes ont laissé un héritage éternel à ton peuple.
Fearsome General, your people call for the recreation of a new Hunnic Empire, one which will make the exploits and histories of the former seem like the faded dreaming of a dying sun. Will you answer their call to regain your rightful prominence and glory? Will mount your steadfast steed and lead your armies to victory? Will you build a civilization that stands the test of time? = Redoutable Général, votre peuple réclame la recréation d'un nouvel Empire hunnique, un empire qui fera passer les exploits et l'histoire de l'ancien pour un rêve évanoui. Répondrez-vous à leur appel pour retrouver la gloire et la notoriété qui vous reviennent? Enfourcherez-vous votre fidèle destrier et mènerez-vous vos armées à la victoire? Bâtirez-vous une civilisation à l'épreuve du temps?
