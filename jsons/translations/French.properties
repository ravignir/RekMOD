Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Long have your people lived near the great and holy lake Ontario in the land that has come to be known as the New York state in North America. In the mists of antiquity, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida united into one nation, the Haudenosaunee, the Iroquois. With no written language, the wise men of your nation created the great law of peace, the model for many contitutions including that of the United States. For many years, your people battled great enemies, such as the Huron, and the French and English invaders. Tought outnumbered and facing weapons far more advanced than the ones your warriors wielded, the Iroquois survived and prospered, until they were finally overwhelmed by the mighty armies of the new United States. = Salutations, noble Hiawatha, chef des puissantes nations iroquoises! Votre peuple vit depuis longtemps près du grand et sacré lac Ontario, sur le territoire désormais connu sous le nom d'État de New York en Amérique du Nord. Dans les brumes de l'Antiquité, les cinq peuples : Sénécas, Onondagas, Mohawks, Cayugas et Oneidas se sont unis en une seule nation, les Haudenosaunee, les Iroquois. Sans langue écrite, les sages de votre nation ont créé la grande loi de paix, modèle de nombreuses constitutions, dont celle des États-Unis. Pendant de nombreuses années, votre peuple a combattu de grands ennemis, tels que les Hurons et les envahisseurs français et anglais. Considérés comme inférieurs en nombre et confrontés à des armes bien plus perfectionnées que celles de vos guerriers, les Iroquois ont survécu et prospéré, jusqu'à leur défaite face aux puissantes armées des nouveaux États-Unis.
