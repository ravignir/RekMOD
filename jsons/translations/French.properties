Welcome, O divine Montezuma! We grovel in awe at your magnificence! May the heaven shower all manner of good things upon you all the days of your life! Your are the leader of the mighty Aztec people, wandering nomads from a lost home in the north who in the 12th century came to live in the mesa central in the heart of what would come to be call Mexico. Surrounded by many tribes fighting to control the rich land surrounding the sacred lakes of Texoco, Xaltocan and Zampango. Through cunning alliances and martial prowess, within a mere two hundred years, the Aztecs came to dominate the Central American basin, ruling a mighty empire stretching from sea to sea. But the empire fell soon under the assault of the accursed Spaniards, wielding fiendish weapons the likes of which your faithful warriors had never seen. = Bienvenue, ô divin Montezuma! Nous rampons devant ta magnificence! Que le ciel te comble de bienfaits tous les jours de ta vie! Vous êtes les chefs du puissant peuple aztèque, des nomades errants venus d'un pays perdu du nord qui, au XIIe siècle, s'installèrent sur la mesa centrale, au cœur de ce qui allait devenir le Mexique. Encerclés par de nombreuses tribus luttant pour le contrôle des riches terres entourant les lacs sacrés de Texoco, Xaltocan et Zampango. Grâce à des alliances astucieuses et à des prouesses martiales, en seulement deux siècles, les Aztèques dominèrent le bassin d'Amérique centrale, dirigeant un puissant empire s'étendant d'un océan à l'autre. Mais cet empire tomba bientôt sous l'assaut des maudits Espagnols, maniant des armes diaboliques telles que vos fidèles guerriers n'en avaient jamais vues.
O great king Montezuma, your people call upon you once more, to rise up and lead them to glory, bring them wealth and power, and give them dominion over their foes and rivals. Will you answer their call, glorious leader? Will you build a civilization that stands the test of time? = Ô grand roi Montezuma, ton peuple t'appelle une fois de plus pour te lever et le mener à la gloire, lui apporter richesse et pouvoir, et lui assurer la domination sur ses ennemis et rivaux. Répondras-tu à leur appel, glorieux dirigeant? Bâtiras-tu une civilisation qui résistera à l'épreuve du temps?

May the blessings of heaven be upon you, O great Nebuchadnezzar, father of mighty and ancient Babylon! Young was the world when Sargon built Babylon some five thousand years ago, long did it grow and prosper, gaining its first empire the eighteenth century BC, under godlike Hammurabi, the giver of law. Although conquered by the Kassites and then by the Assyrians, Babylon endured, emerging phoenix-like from its ashes of destruction and regaining its independence despite its many enemies. Truly was Babylon the center of arts and learning in the ancient world. O Nebuchadnezzar, your empire endured but a short time after your death, falling to the mighty Persians, and then to the Greeks, until the great city was destroyed by 141 BC. = Que les bénédictions du ciel soient sur toi, ô grand Nabuchodonosor, père de la puissante et antique Babylone! Le monde était jeune lorsque Sargon fonda Babylone il y a environ cinq mille ans ; il connut une longue croissance et une longue prospérité, conquérant son premier empire au XVIIIe siècle av. J.-C., sous le règne d'Hammourabi, le divin donneur de lois. Bien que conquise par les Kassites puis par les Assyriens, Babylone résista, renaissant tel un phénix de ses cendres et recouvrant son indépendance malgré ses nombreux ennemis. Babylone était véritablement le centre des arts et du savoir dans le monde antique. Ô Nabuchodonosor, ton empire ne dura que peu de temps après ta mort, tombant aux mains des puissants Perses, puis des Grecs, jusqu'à la destruction de la grande cité en 141 av. J.-C. 
But is Babylon indeed gone forever, great Nebuchadnezzar? Your people look to you to bring the empire back to life once more. Will you accept the challenge? Will you build a civilization that will stand the test of time? = Mais Babylone a-t-elle vraiment disparu à jamais, grand Nabuchodonosor? Votre peuple compte sur vous pour redonner vie à l'empire. Accepterez-vous le défi  Construirez-vous une civilisation qui résistera à l'épreuve du temps?

Leopold II = Léopold II
Will you treat my savages kindly, as I have done? = Traiterez-vous mes sauvages avec bonté, comme je l'ai fait?
Greetings to you. I am Leopold II Of Belgium, founder AND absolute ruler of the Congo Free State. = Salutations. Je suis Léopold II de Belgique, fondateur et souverain absolu de l'État indépendant du Congo.
Would you be interested in a trade agreement with us? We've got chocolate. = Seriez-vous intéressé par un accord commercial avec nous ? Nous avons du chocolat.
Colonialist Riches = Richesses Colonialistes
Fledgling Belgium looks to you, Leopold II, King of the Belgians. In your forty-four years of rule, you strove to bring Belgium to the forefront of European progress - to make her a model for industry and her wealth the envy of lesser nations. With the help of the explorer Henry Morton Stanley, you privately laid claim to the Congo, whose immense natural wealth would be put to the advancement of your kingdom. Though your reputation abroad would ultimately succumb to controversy, your public works would nonetheless put the Belgian people on the path to progress.  = La jeune Belgique se tourne vers vous, Léopold II, roi des Belges. Durant vos quarante-quatre années de règne, vous vous êtes efforcé de placer la Belgique à l'avant-garde du progrès européen, de faire d'elle un modèle industriel et de faire de sa richesse l'envie des nations plus petites. Avec l'aide de l'explorateur Henry Morton Stanley, vous avez revendiqué en secret le Congo, dont les immenses richesses naturelles allaient servir à l'essor de votre royaume. Même si votre réputation à l'étranger allait finalement succomber à la controverse, vos travaux publics allaient néanmoins mettre le peuple belge sur la voie du progrès.
King Leopold, once more Belgium must make haste if it is to maintain its stride with the march of progress. Can you take up the charge and bring wealth and ingenuity to your kingdom? Can you leave your people with great public works and develop Belgium into a modern nation? Can you build a civilization that can stand the test of time? = Roi Léopold, une fois de plus, la Belgique doit se hâter si elle veut maintenir le cap sur le progrès. Saurez-vous prendre les choses en main et apporter richesse et ingéniosité à votre royaume? Pourrez-vous léguer à votre peuple de grands travaux publics et faire de la Belgique une nation moderne? Saurez-vous bâtir une civilisation capable de résister à l'épreuve du temps?
