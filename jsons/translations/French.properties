You have no respect for our lands, nor for peace. If we must die, we will die defending our rights. = Vous n'avez aucun respect pour nos terres, ni pour la paix. Si nous devons mourir, nous mourrons en défendant nos droits.
I have failed once again. The Ghost Dance, however, will go on without me, devil. = J'ai encore échoué. Mais la Danse des Esprits continuera sans moi, démon.
I am Sitting Bull, son of the Jumping Bull, chieftain of the Hunkpapa Lakota! Have you seen buffalos recently? = Je suis Sitting Bull, fils du Taureau Sauteur, chef des Lakotas Hunkpapa! Avez-vous vu des bisons récemment?
Each man is a good man in the eyes of the Great Spirit. Let us put our minds together at least this once. = Chaque homme est un homme bon aux yeux du Grand Esprit. Réunissons nos esprits au moins cette fois.
State your business. = Présentez vos plans.
Dwellers of the Plains = Habitants des Plaines
Proud Sitting Bull, Chief of the Hunkpapa Lakota, the Seven Council Fires gather to listen and honour your wisdom. Seasoned hunters, the Sioux followed the buffalo from the shores of Lake Superior to the Black Hills of the western Dakotas. With the introduction of the horse, they became fearless warriors, dominating the Great Plains and driving back the Kiowa and Pawnee. Your existance marked the peak of the united tribes led by you, for it crossed the borders of reservation, the symbol of tyranny and humiliation, and defeated the Americans under Little Bighorn, sending a message of liberty and freedom to the world. Alas, your people were fighting a losing battle, for the United States had grown too big, too fast. In just a few short years, even the promised reservations were reduced to mere fractions of their original size, and eventually you yourself fell victim of an assasination at the hands of the white man. Yet, the Sioux legacy survived and your people finally won their rights, inspired by your courage. = Fier Sitting Bull, chef des Lakotas Hunkpapa, les Sept Feux du Conseil se rassemblent pour écouter et honorer votre sagesse. Chasseurs aguerris, les Sioux ont suivi le bison des rives du lac Supérieur jusqu'aux Black Hills de l'ouest du Dakota. Avec l'introduction du cheval, ils sont devenus des guerriers intrépides, dominant les Grandes Plaines et repoussant les Kiowas et les Pawnees. Votre existence a marqué l'apogée des tribus unies que vous avez dirigées, car elle a franchi les frontières des réserves, symbole de tyrannie et d'humiliation, et a vaincu les Américains sous Little Bighorn, envoyant un message de liberté au monde. Hélas, votre peuple menait une bataille perdue d'avance, car les États-Unis étaient devenus trop grands, trop vite. En quelques années seulement, même les réserves promises ont été réduites à de minuscules fractions de leur superficie initiale, et vous avez finalement été victime d'un assassinat aux mains de l'homme blanc. Pourtant, l'héritage sioux a survécu et votre peuple a finalement obtenu ses droits, inspiré par votre courage.
Itancan, your enemies have sold your lands and slaughtered the buffalo, but the Great Spirit has allowed you to lead your people once again, as your courage and guidance are needed once more. Will you re-establish the ancestral hunting grounds and defend your people from foreign expansion? Can you build a civilization that will stand the test of time? = Itancan, tes ennemis ont vendu tes terres et massacré les buffles, mais le Grand Esprit t'a permis de diriger à nouveau ton peuple, car ton courage et tes conseils sont à nouveau nécessaires. Sauras-tu rétablir les territoires de chasse ancestraux et défendre ton peuple contre l'expansion étrangère? Sauras-tu bâtir une civilisation qui résistera à l'épreuve du temps?
