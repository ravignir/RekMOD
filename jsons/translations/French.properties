Nzinga Mbande = 
Me and my warriors come to set your lands and your flags on fire! = Moi et mes guerriers venons mettre le feu à vos terres et à vos drapeaux!
Go ahead, send your soldiers! We will melt into the trees and strike at you from the stones. = Allez-y, envoyez vos soldats! Nous nous fondrons dans les arbres et vous attaquerons depuis les pierres.
Your swords cleave only flesh. Your chains bind only hands. Our soul remains ours. = Vos épées ne fendent que la chair. Vos chaînes ne lient que les mains. Notre âme reste nôtre.
I am Nzinga, Muchino a Muhato of the Ndongo and Matamba. Please sit anywhere, and do not look down upon me and dismiss me as a woman: I am the equal of any King, both in governance and in battle. = Je suis Nzinga, Muchino, une Muhato du Ndongo et du Matamba. Veuillez vous asseoir où vous voulez, et ne me méprisez pas et ne me rejetez pas en tant que femme : je suis l'égale de tout roi, tant au pouvoir qu'au combat.
Let us exchange ideas, gold, and good... just not land. = Échangeons des idées, de l’or et du bien… mais pas de la terre.
Heart of Africa = Coeur de l'Afrique
Hail to you, brave Nzinga Mbande, Queen of the Ndongo and Matamba, whose beauty is matched only by your cunning. Your Kingdom is part of the great Kingdom of Kongo, situated at the mouth of the mighty Congo River in west-central Africa. You defied tradition by claiming two thrones and are remembered for standing bravely against the onslaught of European imperialism. When the Portuguese invaded your lands, you escaped death and shrewdly manipulated the Dutch into sending you aid. Together you turned back the army of the Portuguese at the Battle of Kombi. Yet, ever faced with threats both inside and out, the never-ending war took its tool, and in the end not even your bravery could stop the march of foreign crowns. = Salut à toi, courageuse Nzinga Mbande, reine du Ndongo et du Matamba, dont la beauté n'a d'égale que ta ruse. Ton royaume fait partie du grand royaume du Kongo, situé à l'embouchure du puissant fleuve Congo, en Afrique centrale occidentale. Tu as défié la tradition en revendiquant deux trônes et tu es restée dans les mémoires pour ta bravoure face à l'assaut de l'impérialisme européen. Lorsque les Portugais ont envahi tes terres, tu as échappé à la mort et as habilement manipulé les Hollandais pour qu'ils t'envoient de l'aide. Ensemble, tu as repoussé l'armée portugaise à la bataille de Kombi. Pourtant, confrontée aux menaces intérieures et extérieures, la guerre sans fin a fait rage, et finalement, même ton courage n'a pas pu arrêter la marche des couronnes étrangères.
Mighty Queen of Kongo, your prople has been chained and sold into slavery. Yet, your old alliances stand firm and await your call. It is time to return, to instill your strenght and spirit and lead your people to battle once more. Can you restore your war-torn land? Can you build a civilization that will stand the test of time? = Puissante Reine du Kongo, votre peuple a été enchaîné et vendu comme esclave. Pourtant, vos anciennes alliances tiennent bon et attendent votre appel. Il est temps de revenir, d'infuser votre force et votre courage et de mener votre peuple au combat une fois de plus. Saurez-vous restaurer votre terre ravagée par la guerre? Saurez-vous bâtir une civilisation qui résistera à l'épreuve du temps?
