Honestly, I grow tired of this peace between us. Don't be surprised: that is to be expected from a people of Viking ancestry. = Honnêtement, je commence à en avoir assez de cette paix entre nous. Ne soyez pas surpris : c'est normal pour un peuple d'origine viking.
I adamantly refuse to willingly cede you my throne: take it from my cold, dead hands, if you dare! = Je refuse catégoriquement de te céder volontairement mon trône : prends-le de mes mains froides et mortes, si tu l'oses!
Your victory humbles me; to the victor go the spoils and I shall stand in your way no more. = Ta victoire m'humilie, le butin revient au vainqueur et je ne me mettrai plus en travers de ton chemin.
Hail to you. I am William, Duke of Normandy. Bring not misfortune to my court and we shall be fond allies. = Salut à vous. Je suis Guillaume, duc de Normandie. Ne portez pas malheur à ma cour et nous serons de fidèles alliés.
We are more than warriors, and this deal can prove it. = Nous sommes plus que des guerriers, et cet accord peut le prouver.
Hail to thee, great Duke William of Normandy! Your people are a proud and noble race; hailing from their beginnings as Viking warriors, the Normans quickly established themselves as a persevering and formidable culture. Taking for themselves a land of their own in France, the Normans would spread their martial and cultural influence across Europe and the Mediterranean. With conquests in Southern Italy, Northern Africa, and the Levant, the might and piety of the Normans would know no match and, with you, Duke, at its stead, history would weave Normandy's boldest claim; for that of the throne of England, of which it would take, and change forever. = Salut à toi, grand duc Guillaume de Normandie! Ton peuple est une race fière et noble ; issu de leurs origines de guerriers vikings, les Normands se sont rapidement imposés comme une culture persévérante et redoutable. S'appropriant une terre en France, les Normands ont étendu leur influence militaire et culturelle à travers l'Europe et la Méditerranée. Avec leurs conquêtes en Italie du Sud, en Afrique du Nord et au Levant, la puissance et la piété des Normands étaient sans égales et, avec toi, Duc, à sa place, l'histoire allait tisser la plus audacieuse revendication de la Normandie : celle du trône d'Angleterre, qu'elle allait conquérir et changer à jamais.
Noble William, who took Excalibur and seized the ancient throne of the Britons, it is time to lay claim to the lands that are rightfully yours. Can you inspire the martial glory of your people once more? Can you build a civilization that will stand the test of time? = Noble Guillaume, qui avez pris Excalibur et conquis l'ancien trône des Bretons, il est temps de revendiquer les terres qui vous reviennent de droit. Saurez-vous inspirer à nouveau la gloire martiale de votre peuple? Saurez-vous bâtir une civilisation qui résistera à l'épreuve du temps?
