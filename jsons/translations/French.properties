Harald Hardrada, the last great Viking warrior-king, your name echoes through the ages. From your early days as a mercenary in the Byzantine Empire to your rise as King of Norway, your life has been a testament to strength, cunning, and unyielding ambition. Your campaigns have set the stage for a new era of Norse dominance. The winds of fate howl through the fjords, calling you to greatness once more. = Harald Hardrada, dernier grand roi-guerrier viking, votre nom résonne à travers les âges. De vos débuts de mercenaire dans l'Empire byzantin à votre ascension comme roi de Norvège, votre vie a été un témoignage de force, de ruse et d'ambition inébranlable. Vos campagnes ont ouvert la voie à une nouvelle ère de domination nordique. Les vents du destin soufflent dans les fjords, vous appelant à nouveau à la grandeur.
The Great King of Norway, The Thunderbolt of the North, your people call upon you once more. Will you lead them to glory as you did in the battles of Stiklestad and Niså? Can you reclaim the throne of England and show the world the true power ? Will you build a civilization that will stand the test of time? = Grand Roi de Norvège, Foudre du Nord, votre peuple vous appelle à nouveau. Le mènerez-vous à la gloire comme vous l'avez fait lors des batailles de Stiklestad et de Niså? Pourrez-vous reconquérir le trône d'Angleterre et montrer au monde votre véritable puissance? Construirez-vous une civilisation qui résistera à l'épreuve du temps?
