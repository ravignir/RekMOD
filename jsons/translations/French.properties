Dutch East India Company = Compagnie Néerlandaise des Indes Orientales
Hail stalwart Prince William of Orange, liberator of the Netherlands and hero to the Dutch people. It was your courageous effort in the 1568 rebellion against Spanish dominion that led the Dutch to freedom, and ultimately resulted in the Eighty Years' War. Your undertaking allowed for the creation of one of Europe's first modern republics, the Seven United Provinces. You gave your life to the rebellion, falling at the hands of an assassin in 1584, but your death would only serve to embolden the people's charge, and your legacy as 'Father of the Fatherland' will stand as a symbol of Dutch independence for all time. = Salut au vaillant prince Guillaume d'Orange, libérateur des Pays-Bas et héros du peuple néerlandais. C'est votre courageux engagement lors de la rébellion de 1568 contre la domination espagnole qui a conduit les Pays-Bas à la liberté et a finalement abouti à la guerre de Quatre-Vingts Ans. Votre engagement a permis la création de l'une des premières républiques modernes d'Europe, les Sept Provinces-Unies. Vous avez donné votre vie à la rébellion, succombant aux mains d'un assassin en 1584, mais votre mort n'a fait qu'enhardir la charge du peuple, et votre héritage de 'Père de la Patrie' restera à jamais un symbole de l'indépendance néerlandaise.
