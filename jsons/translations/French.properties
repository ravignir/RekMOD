Blessings be upon you, Grand Duke of Lithuania, Vytautas the Great. It was your majesty that defeated the Golden Horde, ending forever the Mongol's ambitions about Europe. The Lithuanian Empire survived two centuries of the religious crusades, lead by the Teutonic order, finally striking down her great rival at the Battle of Žalgiris. The Duchy officially adopted Christianity with the Union of Krewo, signed by your traitorous brother Jogaila in 1386. Despite losing political and cultural solidarity, Lithuania was finally restored to sovereignity in the twentieth century. = Que Dieu vous bénisse, Grand-Duc de Lituanie, Vytautas le Grand. C'est Votre Majesté qui a vaincu la Horde d'Or, mettant fin à jamais aux ambitions mongoles sur l'Europe. L'Empire lituanien a survécu à deux siècles de croisades religieuses, menées par l'ordre teutonique, et a finalement vaincu son grand rival à la bataille de Žalgiris. Le duché a officiellement adopté le christianisme avec l'Union de Krewo, signée par votre frère traître Jogaila en 1386. Malgré la perte de sa solidarité politique et culturelle, la Lituanie a finalement retrouvé sa souveraineté au XXe siècle.
The path of glory is calling you, Vytautas, Son of the Forest, baptised into the Church of Christ. Will you lead your people in the name of holiness? Will you create the Empire your people have always deserved? Can you build a civilization that will stand the test of time? = Le chemin de la gloire t'appelle, Vytautas, Fils de la Forêt, baptisé dans l'Église du Christ. Dirigeras-tu ton peuple au nom de la sainteté? Créeras-tu l'Empire que ton peuple a toujours mérité? Sauras-tu bâtir une civilisation qui résistera à l'épreuve du temps?
