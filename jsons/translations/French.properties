Few can boast your patriotism and commitment to the cause of a Free Ireland, Commander Collins. Though you came from the humblest of beginnings, you truly embodied the pride of Irishness. It was not long before you joined the struggle for Home Rule, and you began to build a reputation for yourself – one of dedication, devotion, and pride for Ireland. After the Easter Rising turned bloody, you managed to turn a beaten movement into a potent physical force, one that would successfully found an Irish nation, fight a war for liberation, and win independence. Some did not share your view, however, and soon this incomplete nation descended once more into war. And though you paid the ultimate cost in the subsequent civil war, you gave your life for a free state that was established soon after. = Rares sont ceux qui peuvent se vanter de votre patriotisme et de votre engagement pour la cause d'une Irlande libre, Commandant Collins. Bien que issu d'un milieu très modeste, vous incarniez véritablement la fierté irlandaise. Vous avez rapidement rejoint la lutte pour l'autonomie et commencé à vous forger une réputation de dévouement, de dévouement et de fierté pour l'Irlande. Après le massacre de Pâques, vous avez réussi à transformer un mouvement vaincu en une force physique puissante, capable de fonder une nation irlandaise, de mener une guerre de libération et d'obtenir l'indépendance. Cependant, certains ne partageaient pas votre point de vue, et bientôt cette nation incomplète sombra à nouveau dans la guerre. Et bien que vous ayez payé le prix fort lors de la guerre civile qui s'ensuivit, vous avez donné votre vie pour un État libre établi peu après.
Michael Collins, Ireland looks up to you again for guidance in a new time of hardship. Will you serve once more for your nation and your people? Will you overcome those that seek to shackle you? Can you build a civilization that will stand the test of time? = Rares sont ceux qui peuvent se vanter de votre patriotisme et de votre engagement pour la cause d'une Irlande libre, Commandant Collins. Bien que issu d'un milieu très modeste, vous incarniez véritablement la fierté irlandaise. Vous avez rapidement rejoint la lutte pour l'autonomie et commencé à vous forger une réputation de dévouement, de dévouement et de fierté pour l'Irlande. Après le massacre de Pâques, vous avez réussi à transformer un mouvement vaincu en une force physique puissante, capable de fonder une nation irlandaise, de mener une guerre de libération et d'obtenir l'indépendance. Cependant, certains ne partageaient pas votre point de vue, et bientôt cette nation incomplète sombra à nouveau dans la guerre. Et bien que vous ayez payé le prix fort lors de la guerre civile qui s'ensuivit, vous avez donné votre vie pour un État libre établi peu après.
