Welcome President Washington! You lead the industrious American civilization! Formed in the conflagration of revolution in the 18th century, within a hundred years, the young nation became embroiled in a terrible civil war that nearly tore the country apart, but it was just a few short years later in the 20th century that the United States reached the height of its power, emerging triumphant and mighty from the two terrible wars that destroyed so many other great nations. The United States is a nation of immigrants, filled with optimism and determination. They lack only a leader to help them fulfill their promise. = Bienvenue, Président Washington! Vous êtes à la tête de la civilisation américaine industrieuse! Née dans le brasier de la révolution au XVIIIe siècle, la jeune nation fut, en un siècle, entraînée dans une terrible guerre civile qui faillit la déchirer. Mais ce n'est que quelques années plus tard, au XXe siècle, que les États-Unis atteignirent l'apogée de leur puissance, sortant triomphants et puissants de deux guerres terribles qui détruisirent tant d'autres grandes nations. Les États-Unis sont une nation d'immigrants, pleine d'optimisme et de détermination. Il ne leur manque qu'un leader pour les aider à tenir leurs promesses.
