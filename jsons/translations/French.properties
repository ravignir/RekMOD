I usually seek council to my sages, but this time it is arms that I must express myself. = D'habitude, je cherche conseil auprès de mes sages, mais cette fois, c'est par les armes que je dois m'exprimer.
May Vishny's wrath engulf you into ruin and despair! = Que la colère de Vishny vous engloutisse dans la ruine et le désespoir!
What do you mean it's the end? My workd it's yet to be finished! Let me build... just... one... more... temple... = Comment ça, c'est la fin? Mon monde n'est pas encore terminé! Laisse-moi construire... juste... un... autre... temple...
You look upon the King of Angkor, Emperor of Khmer, rightful Ruler of the World and Master of the Universe! We've just met, but I can already tell you're quite an interesting individual. = Vous êtes le roi d'Angkor, l'empereur des Khmers, le souverain légitime du monde et le maître de l'univers! Nous venons de nous rencontrer, mais je peux déjà vous dire que vous êtes une personne intéressante.
Heaven smiles upon you - as do the Khmer. Isn't it great deal? = Le ciel vous sourit, tout comme les Khmers. N'est-ce pas formidable?
Welcome = Bienvenue
Grand Baray of Angkor = Grand Baray d'Angkor
Great Suryavarman, Emperor of the Khmer, the one who has entered the heavenly world of Vishnu, we kneel blinded by your glory! You reunited a divided empire and made it stronger than ever before, expanding its borders to the west and north and reaching the present-day peninsular Malaysia. Merciless to enemies, kind to friends, you established good relations with China, creating new important trade routes. You innovated the arts and architecture of the empire, and even gave the order to build the legendary Angkor Wat, the largest temple in the known world! In the end, your empire collapsed below its own greatness long before the Europeans managed to create their "civilizations", and yet history remembers you as a warrior, diplomat, artist and religious man. = Grand Suryavarman, empereur des Khmers, celui qui a pénétré dans le monde céleste de Vishnu, nous nous agenouillons, aveuglés par ta gloire! Tu as réuni un empire divisé et l'as rendu plus fort que jamais, élargissant ses frontières à l'ouest et au nord, jusqu'à atteindre l'actuelle Malaisie péninsulaire. Impitoyable envers tes ennemis, bienveillant envers tes amis, tu as établi de bonnes relations avec la Chine, créant de nouvelles routes commerciales importantes. Tu as innové dans les arts et l'architecture de l'empire, et tu as même donné l'ordre de construire le légendaire Angkor Vat, le plus grand temple du monde connu! Finalement, ton empire s'est effondré sous sa propre grandeur bien avant que les Européens ne parviennent à créer leurs 'civilisations', et pourtant l'histoire se souvient de toi comme d'un guerrier, d'un diplomate, d'un artiste et d'un homme religieux.
