The neverending glory be upon you. King Gilgamesh, most legendary and mystical ruler of Sumeria! Oh mighty king, whose hands built the city-walls of Uruk and eyes saw the sage Utnapishtim! You are the leader of the Sumer, the first and the only civilization that was truely original and innovative. Sumer's history stretches back into time when the Gods were walking alongside the mere mortals. Sumer, the cradle of civilization, made a great progress in our history, gave the world most beatiful things - literature, architecture and music - and developed professional army, immortalizing the very first battle in the stele. Sumer's contributions to the civlization of man are uncountable. = Que la gloire éternelle soit sur toi. Roi Gilgamesh, souverain légendaire et mystique de Sumer! Ô roi puissant, dont les mains ont bâti les remparts d'Uruk et dont les yeux ont vu le sage Utnapishtim! Tu es le chef des Sumer, la première et la seule civilisation véritablement originale et innovante. L'histoire de Sumer remonte à l'époque où les dieux côtoyaient les simples mortels. Sumer, berceau de la civilisation, a marqué un tournant dans notre histoire, a donné au monde les plus beaux trésors – littérature, architecture et musique – et a développé une armée professionnelle, immortalisant la toute première bataille sur la stèle. Les contributions de Sumer à la civilisation humaine sont innombrables.
Divine King, who, with strength and wisdom, built the glory of the ancient Sumer and became the very first hero of the history - people seek for your guidance! The wealth of Euphrates, Tigris and the whole Fertile Crescent cannot be wasted in the hands of barbarians. Can you once more bring glory and light to the humankind? Can you build a civilization to stand the test of time? = Roi divin, toi qui, par ta force et ta sagesse, as bâti la gloire de l'ancienne Sumer et es devenu le premier héros de l'histoire, le peuple recherche ta guidance! Les richesses de l'Euphrate, du Tigre et de tout le Croissant Fertile ne peuvent être gaspillées entre les mains de barbares. Sauras-tu redonner gloire et lumière à l'humanité? Sauras-tu bâtir une civilisation qui résistera à l'épreuve du temps?
