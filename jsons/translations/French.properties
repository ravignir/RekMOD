Macedonian Discipline = Discipline Macédonienne
May the blessings of the gods be upon you, oh great king Alexander, son of Zeus! You rule the great Kingdom of Macedon, the most powerful empire in the world! In a mere fraction of a lifetime, you led your armies to victory upon victory, destroyed the villainous Persians, and in the process forged an empire from Illyria to the Indus Valley. Art and literature, phulosophy and science, all flourished within your kingdom, spreading the Hellenic culture across the known world. Under your rule, Macedon dominated the Old World, both militarily and culturally! Alas, this would not last. Your vast empire was torn apart from within following your tragic death, divided amongst your generals into their own personal holdings. = Que les bénédictions des dieux soient sur toi, ô grand roi Alexandre, fils de Zeus! Tu règnes sur le grand royaume de Macédoine, l'empire le plus puissant du monde! En une fraction de vie, tu as mené tes armées à la victoire, anéanti les pervers Perses et, ce faisant, forgé un empire s'étendant de l'Illyrie à la vallée de l'Indus. L'art et la littérature, la philosophie et la science prospérèrent dans ton royaume, propageant la culture hellénique à travers le monde connu. Sous ton règne, la Macédoine domina le Vieux Monde, tant militairement que culturellement! Hélas, cela ne dura pas. Ton vaste empire fut déchiré de l'intérieur après ta mort tragique, divisé entre tes généraux et leurs possessions personnelles.
Alexander, your soldiers stand ready to march upon the world once more, to bring the great Greek culture to millions and to bring you everlasting glory! Are you ready to accept your destiny, King Alexander? Will you lead your people to triumph and eternal greatness? Can you build a civilization that will stand the test of time? = Alexandre, tes soldats sont prêts à parcourir le monde une fois de plus, à faire connaître la grande culture grecque à des millions de personnes et à t'apporter une gloire éternelle! Es-tu prêt à accepter ton destin, Roi Alexandre? Conduiras-tu ton peuple au triomphe et à la grandeur éternelle? Sauras-tu bâtir une civilisation qui résistera à l'épreuve du temps?
