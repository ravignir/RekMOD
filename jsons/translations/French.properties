Greetings, President Mahatma Gandhi, great souled leader of India! You are the ruler of one of the oldest countries in the world with history stretching back almost 10'000 years. A spiritual country, India is the birthplace of three of the world's great religions - Hinduism, Buddhism and Jainism. This is a passionate land of music and color, a land of great wealth and grinding poverty. For centuries, India was divided into kingdoms who fought constantly with each other and against outside invaders. That was, horever, after empires such as Maratha, Maurya and Gupta. In the 12th century AD, India was conquered by Muslim Turks fled from the Mongols. In the early 17th century, the English arrived, and thought a combination of shrewd diplomacy and technological supeiority, they conquered your fragmented nation. England remained in power for some two centuries until driven out by a rising wave of Indian nationalism, a peaceful rebellion unlike any before seen in history, one led by you! = Salutations, Président Mahatma Gandhi, grand dirigeant de l'Inde! Vous êtes le dirigeant de l'un des plus anciens pays du monde, dont l'histoire remonte à près de 10 000 ans. Pays spirituel, l'Inde est le berceau de trois des plus grandes religions du monde : l'hindouisme, le bouddhisme et le jaïnisme. C'est une terre passionnée de musique et de couleurs, une terre d'une grande richesse et d'une pauvreté extrême. Pendant des siècles, l'Inde a été divisée en royaumes qui se livraient une lutte constante entre eux et contre les envahisseurs extérieurs. Cependant, c'était après la création d'empires tels que les Marathes, les Mauryas et les Guptas. Au XIIe siècle après J.-C., l'Inde fut conquise par des Turcs musulmans fuyant les Mongols. Au début du XVIIe siècle, les Anglais arrivèrent et, grâce à une diplomatie avisée et à leur supériorité technologique, ils conquirent votre nation fragmentée. L'Angleterre resta au pouvoir pendant environ deux siècles, jusqu'à ce qu'elle soit chassée par une vague montante de nationalisme indien, une rébellion pacifique sans précédent dans l'histoire, menée par vous!
Gandhi, your people look to you to lead them to even greater heights of glory! Can you help your people realize their great potential, to once again become the world's center of arts, culture and religion? Can you build a civilization that will stand the test of time? = Gandhi, ton peuple compte sur toi pour le mener vers des sommets de gloire encore plus élevés! Sauras-tu aider ton peuple à réaliser son immense potentiel et à redevenir le centre mondial des arts, de la culture et de la religion? Sauras-tu bâtir une civilisation qui résistera à l'épreuve du temps?

Don't mean to stand in your way, but I have to protect them! = Je ne veux pas me mettre en travers de votre chemin, mais je dois les protéger!
