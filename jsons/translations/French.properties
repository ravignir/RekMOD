I'm getting bored of this throne of mine. I will take YOURS instead. = Je commence à en avoir assez de mon trône. Je vais plutôt prendre le TIENS.
Now what is this?! You ask me to add your riches to my great avails. The invitation is accepted. = Qu'est-ce que c'est que ça?! Vous me demandez d'ajouter vos richesses à mes grands bienfaits. L'invitation est acceptée.
My people will mourn me not with tears but with human blood. = Mon peuple ne me pleurera pas avec des larmes, mais avec du sang humain.
You are now in front of Attila, the misfortunes of the city of Rome. = Vous êtes maintenant devant Attila, les malheurs de la ville de Rome.
