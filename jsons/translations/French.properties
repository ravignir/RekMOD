Honour be with you, oh great hero Gajah Mada, prime minister of Majapahit and uniter of the Indonesian archipelago. The stories of your heroism on the battlefield are bested only by the legends of your sworn oath to unite the far-flung islands of Indonesia under one banner. Serving your queen and empire with loyalty, you not only strive to fulfill your oath and conquered any who stood in your path, but you succeeded in capturing what was then the entirety of the known archipelago, the first to unite what is today modern Indonesia. = Que l'honneur soit avec toi, ô grand héros Gajah Mada, Premier ministre de Majapahit et unificateur de l'archipel indonésien. Les récits de ton héroïsme sur le champ de bataille n'ont d'égal que les légendes de ton serment d'unir les îles lointaines d'Indonésie sous une même bannière. Servant ta reine et ton empire avec loyauté, tu as non seulement tenu ton serment et vaincu tous ceux qui se dressaient sur ton chemin, mais tu as également réussi à conquérir ce qui était alors la totalité de l'archipel connu, le premier à unifier l'Indonésie moderne.
