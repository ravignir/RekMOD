Greetings to you, exalted King Sejong the Great, servant to the people and protector of the Choson Dynasty! Your glorious vision of prosperity and overwhelming benevolence towards the common man made you the most beloved of all Korean kings. From the earliest days of your reign, the effort you took to provide a fair and just society for all was surpassed only by the technological advances spurred onwards by your unquenched thirst for knowledge. Guided by your wisdom, the scholars of the Jade Hall developed Korea's first written language, Hangul, bringing the light of literature and science to the masses after centuries of literary darkness. = Salutations à vous, exalté roi Sejong le Grand, serviteur du peuple et protecteur de la dynastie Choson! Votre vision glorieuse de la prospérité et votre immense bienveillance envers le commun des mortels ont fait de vous le plus aimé de tous les rois coréens. Dès les premiers jours de votre règne, vos efforts pour instaurer une société juste et équitable pour tous n'ont été surpassés que par les avancées technologiques stimulées par votre soif insatiable de savoir. Guidés par votre sagesse, les érudits de la Salle de Jade ont développé la première langue écrite de Corée, le hangeul, apportant la lumière de la littérature et de la science au grand public après des siècles d'obscurité littéraire.
