Ali ibn al-Hassan Shirazi = 
It is horrible both you and I have to resort to war. But what's done is done, I suppose... = C'est horrible que nous soyons tous les deux obligés de recourir à la guerre. Mais ce qui est fait est fait, je suppose…
I think you know I have this great stash of gold like barely anyone has ever seen before. Maybe you can reconsider... No? Okay, fine, your loss... = Je crois que tu sais que j'ai une réserve d'or incroyable comme personne n'en a jamais vu. Tu devrais peut-être reconsidérer ta décision… Non? Bon, d'accord, tu as perdu…
At least I am defeated in battle, instead of falling by some treacherous vizier or an unknown cousin... = Au moins, je suis vaincu au combat, au lieu de tomber aux mains d'un vizir traître ou d'un cousin inconnu...
Ah, we finally meet. Rumors and news of your great nation has already reached me through travelers. = Ah, nous nous rencontrons enfin. Des rumeurs et des nouvelles de votre grande nation me sont déjà parvenues par l'intermédiaire de voyageurs.
I urge to accept this deal. I have plenty of colored cloth... = Je vous encourage à accepter cette offre. J'ai beaucoup de tissus colorés…
Merchant Economy = Économie Marchande
Greetings to you, resourceful Ali ibn al-Hassan Shirazi. You are the founder of the mighty Kilwa Sultanate, a proud people of the sea. You purchased the island which would become your capital for mere cloth after your unlawful ostracism at the hands of your brothers, and built it into a proud city, the envy of the known world. From this new capital, your people, proud traders by nature, travelled the length of the African coast, spreading the influence of your sultanate. The Kilwa are a tolerant people, indeed those cities under your rule feature many separate beliefs, languages and peoples - a venerable melting pot of cultures which together forged the identity of the Swahili people who to this day occupy the lands of your former sultanate. = Salutations à toi, Ali ibn al-Hassan Shirazi, plein de ressources. Tu es le fondateur du puissant sultanat de Kilwa, un fier peuple de la mer. Tu as acheté l'île qui allait devenir ta capitale pour une simple somme d'argent, après l'ostracisme illégal de tes frères, et tu en as fait une cité fière, enviée par le monde connu. De cette nouvelle capitale, ton peuple, fier commerçant par nature, a parcouru toute la côte africaine, répandant l'influence de ton sultanat. Les Kilwa sont un peuple tolérant ; les villes sous ton règne présentent en effet de nombreuses croyances, langues et peuples distincts – un vénérable creuset de cultures qui, ensemble, ont forgé l'identité du peuple swahili qui occupe encore aujourd'hui les terres de ton ancien sultanat.
The empire lasted long after your death, with your descendants ruling for many more centuries, expanding the rule of the Kilwa Sultanate far and wide, falling only to an invasion of superior weaponry at the hands of European colonials. Yet none could compare to you, wise leader. Your people call for you to lead them to greatness across the seas. Will you answer their call? Can you build a civilization that will stand the test of time? = L'empire a perduré bien après votre mort, vos descendants régnant encore pendant de nombreux siècles, étendant la domination du sultanat de Kilwa aux quatre coins du monde, avant de succomber à l'invasion des colons européens, dotés d'armes supérieures. Pourtant, nul ne pouvait se comparer à vous, sage dirigeant. Votre peuple vous appelle à le mener vers la grandeur par-delà les mers. Répondrez-vous à son appel? Saurez-vous bâtir une civilisation qui résistera à l'épreuve du temps?
