Hail to Charles the Great, first Emperor since the Fall of Rome, father of a kingdom that encompassed France, Germany, Italy and much of Eastern Europe. Legends of your conquests are pervasive throughout history, and you are without no doubts one of the greatest figureheads of history. The world has known you as both a highly religious man and a philanthropist. You often built friendly relationships with other countries, such as Egypt and India, so that you could later send money in an effort to assist struggling Christians in those regions. Although much more of a conqueror than an economic or social reformer, you have always helped the poor and sick in your kingdom. Despite being unable to write well yourself, you had a vast love of literature and education. Due to your conquests contacts with many different cultures and learning institutions, your era is became known as the Carolingian Renaissance, with a blossoming of the arts and sciences. = Salut à Charles le Grand, premier empereur depuis la chute de Rome, père d'un royaume englobant la France, l'Allemagne, l'Italie et une grande partie de l'Europe de l'Est. Les légendes de vos conquêtes imprègnent l'histoire, et vous êtes sans conteste l'une des plus grandes figures de proue de l'histoire. Le monde vous connaît à la fois comme un homme profondément religieux et un philanthrope. Vous avez souvent noué des relations amicales avec d'autres pays, comme l'Égypte et l'Inde, afin de pouvoir ensuite envoyer de l'argent pour aider les chrétiens en difficulté dans ces régions. Bien que bien plus conquérant que réformateur économique ou social, vous avez toujours aidé les pauvres et les malades de votre royaume. Bien que incapable d'écrire correctement, vous aviez un profond amour pour la littérature et l'éducation. Grâce aux contacts de vos conquêtes avec de nombreuses cultures et institutions d'enseignement, votre époque est connue sous le nom de Renaissance carolingienne, marquée par un essor des arts et des sciences.
Great father of Europe, the one who rebuilt an empire of western Europe, almighty ruler and wise man, the world needs you once more to fulfill the empty pages of history with glorious deeds and epic battles. Shall you once more bring the light to the ones lost in the shadow? Can you build a civilization that will stand the test of time? = Grand père de l'Europe, celui qui a reconstruit l'empire d'Europe occidentale, souverain tout-puissant et homme sage, le monde a une fois de plus besoin de toi pour remplir les pages vides de l'histoire par des actes glorieux et des batailles épiques. Sauras-tu redonner la lumière à ceux qui sont perdus dans l'ombre? Sauras-tu bâtir une civilisation qui résistera à l'épreuve du temps?
