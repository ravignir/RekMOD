Joke's on you. I will join the einherjar in Valhalla and feast, while you toil away here. = C'est une blague pour toi. Je rejoindrai les Einherjar au Valhalla et festoierai, pendant que tu trimeras dur ici.
Harald Sigurdsson stands before you: a Viking unlike any the seas and lands have ever known. Hah, are you afraid? = Harald Sigurdsson se tient devant vous : un Viking comme les mers et les terres n'en ont jamais connu. Ah, avez-vous peur?
I have sent you traders with gifts of rune stones. They are powerful. I mean, the stones, not the traders. = Je vous ai envoyé des marchands avec des pierres runiques en cadeau. Elles sont puissantes. Je parle des pierres, pas des marchands.
