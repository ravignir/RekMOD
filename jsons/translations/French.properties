All hail the most magnificent and magnanimous Empress Theodora, beloved of Byzantium and of Rome! From the lowly ranks of actress and courtesan you became the most powerful woman in the Roman Empire, consort to Justinian I. Starting in the late 520's AD, you joined your husband in a series of important spiritual and legal reforms, creating many laws which elevated the status of and promoted equal treatment of women in the empire. You also aided in the restoration and construction of many aqueducts, bridges and churches across Constantinople, culminating in the creation of the Hagia Sophia, one of the most splendid architectural wonders of the world. = Salut à la magnifique et magnanime impératrice Théodora, chérie de Byzance et de Rome! Du rang modeste d'actrice et de courtisane, vous êtes devenue la femme la plus puissante de l'Empire romain, épouse de Justinien Ier. À partir de la fin des années 520, vous avez accompagné votre époux dans une série de réformes spirituelles et juridiques importantes, créant de nombreuses lois qui ont élevé le statut et promu l'égalité de traitement des femmes dans l'empire. Vous avez également contribué à la restauration et à la construction de nombreux aqueducs, ponts et églises à Constantinople, aboutissant à la création de Sainte-Sophie, l'une des plus belles merveilles architecturales du monde.
Beautiful Empress, Byzantium is in need of your wisdom and strength - her people are lost without your light to lead them. The Byzantine Empire may have fallen once, but its spirit is still intact waiting to be reborn anew. Can you return Byzantium to the heights of glory it once enjoyed? Can you create a civilization to stand the test of time? = Belle impératrice, Byzance a besoin de votre sagesse et de votre force, son peuple est perdu sans votre lumière pour le guider. L'Empire byzantin a peut-être chuté, mais son esprit est toujours intact, attendant de renaître. Parviendrez-vous à rendre à Byzance sa gloire d'antan? Parviendrez-vous à créer une civilisation capable de résister à l'épreuve du temps?
