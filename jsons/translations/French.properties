Revered king, your composed demeanor once protected the people from the many conflicts that plague the nations of men, and the kingdom looks to you to assure peace once again. Will you lead the people with courage and authority, moving forward into a new age? Will you build a civilization that stands the test of time? = Vénérable roi, votre sang-froid a autrefois protégé le peuple des nombreux conflits qui affligent les nations humaines, et le royaume compte sur vous pour rétablir la paix. Dirigerez-vous le peuple avec courage et autorité, pour entrer dans une ère nouvelle? Construirez-vous une civilisation à l'épreuve du temps?
