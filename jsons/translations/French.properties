May the blessings of God, who is greatest of all, be upon you Askia, leader of the Songhai people! For many years your kingdom was a vassal of the mighty West African state of Mali, until the middle of the 14th century, when King Sunni Ali Ber wrested independence from the Mali, conquering much territory and fighting off numerous foes who sought to destroy him. Ultimately, his conquest of the wealthy cities of Timbuktu and Jenne gave the growing Songhai empire the economic power to survive for some 100 years, until the empire was destroyed by foes with advanced technology - muskets against spearmen. = Que les bénédictions de Dieu, le plus grand de tous, soient sur toi, Askia, chef du peuple songhaï! Pendant de nombreuses années, ton royaume fut vassal du puissant État ouest-africain du Mali, jusqu'au milieu du XIVe siècle, lorsque le roi sunnite Ali Ber arracha son indépendance au Mali, conquérant de vastes territoires et repoussant de nombreux ennemis qui cherchaient à le détruire. Finalement, sa conquête des riches villes de Tombouctou et de Djenné donna à l'empire songhaï en pleine expansion la puissance économique nécessaire à sa survie pendant près d'un siècle, jusqu'à sa destruction par des ennemis dotés de technologies de pointe : mousquets contre lanciers.
King Askia, your people look yo you to lead them to glory. To make them powerful and wealthy, to keep them supplied with the weapons they need to defeat any foe. Can you save them from destruction, oh King? Can you build a civilization that will stand the test of time? = Roi Askia, ton peuple compte sur toi pour le mener à la gloire. Pour le rendre puissant et riche, pour lui fournir les armes nécessaires pour vaincre n'importe quel ennemi. Sauras-tu le sauver de la destruction, ô Roi? Sauras-tu bâtir une civilisation qui résistera à l'épreuve du temps?

Blessed Isabella, servant of God, holy queen of Castille and Leòn! Your people greet and welcome you. You are the ruler of Spain, a beautiful and ancient country at the crossroads of the world between Europe and Africa, one shor on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish are a multicultural people with roots in the Muslim and Christian worlds. A seafaring race, Spanish explorers found and conquered much of the New World, and, for many centuries, its gold and silver brought Spain unrivalled wealth and power, making the Spanish court the  envy of the world. = Bienheureuse Isabelle, servante de Dieu, sainte reine de Castille-et-Leòn! Votre peuple vous salue et vous souhaite la bienvenue. Vous êtes la souveraine de l'Espagne, un pays magnifique et ancien, au carrefour du monde, entre l'Europe et l'Afrique, l'une bordée par la Méditerranée et l'autre par le puissant océan Atlantique. Les Espagnols sont un peuple multiculturel, aux racines musulmanes et chrétiennes. Peuple marin, les explorateurs espagnols ont découvert et conquis une grande partie du Nouveau Monde. Pendant des siècles, son or et son argent ont apporté à l'Espagne une richesse et une puissance inégalées, faisant de sa cour un objet d'envie mondiale.
O fair and virtuous Isabella! Will you rebuld the Spanish empire and show the world again the greatness of your people? Will your take up the mantle of the holy monarchy, and vanquish your foes under heaven's watchful eyes? Your adoring subjects await your command! Will you build a civilization that stands the test of time? = Ô belle et vertueuse Isabelle! Rebâtirez-vous l'empire espagnol et montrerez-vous au monde la grandeur de votre peuple? Reprendrez-vous le flambeau de la sainte monarchie et vaincrez-vous vos ennemis sous le regard vigilant du ciel? Vos sujets en adoration attendent vos ordres! Bâtirez-vous une civilisation qui résistera à l'épreuve du temps?
