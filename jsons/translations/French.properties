William I = Guillaume I
As much as I despise war, I consider it a, hahaha, contribution to the common cause to erase your existence. = Autant je méprise la guerre, autant je considère que c'est, hahaha, une contribution à la cause commune d'effacer votre existence.
You call yourself an exalted ruler, but I see nothing more than a smartly dressed barbarian! = Vous vous dites un dirigeant exalté, mais je ne vois rien de plus qu'un barbare élégamment habillé!
My God, be merciful to my soul. My God, feel pity for this... my poor people! = Mon Dieu, aie pitié de mon âme. Mon Dieu, aie pitié de moi… mon pauvre peuple!
I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do. = Je suis Guillaume d'Orange, stathouder des Pays-Bas. Avez-vous besoin de quelque chose? J'ai encore beaucoup à faire.
I believe I have something that may be of some importance to you. = Je crois que j'ai quelque chose qui pourrait être important pour vous.
